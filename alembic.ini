# Alembic config — миграции БД.
# URL и логика подключения задаются в alembic/env.py (читает settings.database_url).

[alembic]
script_location = alembic

# Шаблон имени для новых миграций: 0001_initial.py, 0002_add_X.py, ...
file_template = %%(rev)s_%%(slug)s

# Чтобы revision-номера были числовыми (0001, 0002, ...), а не md5-хешами.
# Заполняется вручную через `alembic revision -m "..." --rev-id 0002`
# или используется дефолтный uuid — оба варианта валидны.

prepend_sys_path = .
timezone = UTC

# Источник sqlalchemy.url не используется — env.py берёт URL из settings.database_url
# но Alembic требует это поле, поэтому ставим заглушку.
sqlalchemy.url = driver://user:pass@localhost/dbname

[post_write_hooks]
# Опционально: можно добавить ruff/black для автоформатирования новых миграций

# ── Логирование ────────────────────────────────────────────────────────────

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
